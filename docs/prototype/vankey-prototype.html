<title>VanKey Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: page header + segmented switch, then one stage showing either a Windows window (3 columns) or an Android phone frame (bottom nav). */
:root{
  --bg:#f1f2f4; --surface:#ffffff; --surface2:#f5f6f8; --line:#e6e8eb; --fg:#15171a; --muted:#6b7280;
  --accent:#0b7a6b; --accent-fg:#ffffff; --accent-soft:#e2f3ee; --warn:#b45309; --danger:#b42318; --shadow:0 18px 50px rgba(19,32,27,.14);
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#000000; --surface2:#131315; --line:#202024; --fg:#f2f2f5; --muted:#8e8e96;
  --accent:#4bc6b0; --accent-fg:#04201a; --accent-soft:#0f2622; --warn:#f5a54a; --danger:#ff8a7a; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#000000; --surface2:#131315; --line:#202024; --fg:#f2f2f5; --muted:#8e8e96;
  --accent:#4bc6b0; --accent-fg:#04201a; --accent-soft:#0f2622; --warn:#f5a54a; --danger:#ff8a7a; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1400px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.top h1{font:700 22px var(--f-head);margin:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.stage{max-width:1400px;margin:0 auto;overflow-x:auto;padding-bottom:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Windows window */
.win{position:relative;min-width:880px;height:640px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.tbar{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tbar b{font:600 13px var(--f-head);color:var(--fg)}
.tbar .sp{flex:1}
.wbody{flex:1;display:grid;grid-template-columns:200px 300px 1fr;min-height:0}
.wbody.wide{grid-template-columns:200px 1fr}
nav.side{background:var(--surface2);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
nav.side button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
nav.side button:hover{background:var(--accent-soft)}
nav.side button.on{background:var(--accent-soft);color:var(--accent)}
nav.side .n{margin-left:auto;font-size:11px;color:var(--muted)}
nav.side hr{border:0;border-top:1px solid var(--line);margin:8px 4px;width:calc(100% - 8px)}
.col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.sbar{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.sbar label{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--muted)}
.sbar input{flex:1;min-width:0;border:0;background:none;color:var(--fg);padding:8px 0;font:inherit}
.sbar input:focus-visible{outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger)}
.btn.ico{padding:7px 9px}
.rows{overflow:auto;flex:1;min-height:0}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px}
.row:hover{background:var(--surface2)}
.row.on{background:var(--accent-soft)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{cursor:pointer}
.rc{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--accent-soft);min-width:136px;min-height:46px;padding:10px 14px;margin:-6px 0;border-radius:12px;flex:none}
.rc:hover{border-color:var(--accent)}
.rc:active{filter:brightness(.92)}
.rc .code{font:600 15px var(--f-mono);letter-spacing:.04em;color:var(--accent)}
.rc.low .code{color:var(--warn)}
.rc .ring{width:20px;height:20px}
.rc svg.i{width:15px;height:15px;color:var(--muted)}
.rc:hover svg.i{color:var(--accent)}
.card[data-act]{cursor:pointer}
.card[data-act]:hover{border-color:var(--accent)}
.rc .ring circle{stroke-width:3.5}
.av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;font:600 15px var(--f-head);flex:none}
.av.lg{width:52px;height:52px;border-radius:13px;font-size:22px}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px}
.pane{overflow:auto;padding:22px 26px;min-width:0}
.pane h2{font:600 22px var(--f-head);margin:0}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.dhead .sp{flex:1}
.fld{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.fld .l{width:130px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;flex:none}
.fld .v{flex:1;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono)}
.totp{display:flex;align-items:center;gap:14px;margin:18px 0;padding:14px 16px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.totp .code{font:600 30px var(--f-mono);letter-spacing:.08em;flex:1}
.totp small{color:var(--muted);display:block;font-size:12px}
.ring{width:34px;height:34px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:3}
.rbg{stroke:var(--line)}
.rfg{stroke:var(--accent);stroke-dasharray:62.83;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.low .rfg{stroke:var(--warn)}
.low .code{color:var(--warn)}
.foot{margin-top:20px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .code{font:600 26px var(--f-mono);letter-spacing:.08em}
.card .top2{display:flex;align-items:center;gap:10px}
.card .top2 .t{flex:1;min-width:0}
.card .top2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .top2 span{font-size:12px;color:var(--muted)}
.card .bot{display:flex;align-items:center;justify-content:space-between}
.genout{font:600 22px var(--f-mono);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:18px;overflow-wrap:anywhere;margin:16px 0}
.opt{display:flex;align-items:center;gap:12px;padding:8px 0}
.opt input[type=range]{flex:1;accent-color:var(--accent)}
.opt label{display:flex;align-items:center;gap:8px}
.sw{width:38px;height:22px;border-radius:12px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(16px)}
.sec{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--surface)}
.sec h3{font:600 15px var(--f-head);margin:0 0 6px}
.sec p{margin:0 0 10px;color:var(--muted);font-size:13px}
.srow{display:flex;align-items:center;gap:12px;padding:8px 0;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.chip.busy i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.chip.busy i{animation:none}.rfg{transition:none}}

/* lock + modal */
.lock{position:absolute;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:20px}
.lockbox{width:min(340px,100%);text-align:center}
.lockbox .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin:0 auto 16px}
.lockbox .logo svg{width:32px;height:32px}
.lockbox h2{font:700 24px var(--f-head);margin:0 0 4px}
.lockbox p{color:var(--muted);margin:0 0 18px}
.lockbox input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;margin-bottom:10px}
.lockbox .btn{width:100%;padding:11px}
.lockbox .btn+.btn{margin-top:8px}
.modal{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.mbox{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.mbox h3{font:600 18px var(--f-head);margin:0 0 12px}
.mbox label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.mbox input,.mbox select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.lock.auth{display:flex;overflow:auto;z-index:25}
.lock.auth .lockbox{margin:auto;padding-block:8px}
.lockbox input[type=checkbox]{width:auto;margin:0}
.g{width:20px;height:20px;border-radius:50%;background:#fff;color:#4285f4;display:grid;place-items:center;font:700 13px var(--f-head);border:1px solid var(--line)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.note{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:12px;text-align:left;margin:4px 0 10px}
.aerr{color:var(--danger);font-size:12px;min-height:16px;margin-bottom:6px;text-align:left}
.alinks{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.alinks button{border:0;background:none;color:var(--accent);font-weight:500;padding:4px}
.rk{font:600 17px var(--f-mono);letter-spacing:.06em;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px;overflow-wrap:anywhere}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-size:13px}
.devs .srow{border-top:1px solid var(--line)}
.mbox.wide{width:min(480px,100%)}
.mbox textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:12px var(--f-mono);resize:vertical}
.mbox input[type=checkbox]{width:auto}
.tiles{display:grid;gap:8px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile b{display:block}
.tile small{color:var(--muted);font-size:12px}
.ti{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.vf{position:relative;height:210px;border-radius:14px;background:#0b1210;display:grid;place-items:end center;color:#cfe8df;padding-bottom:10px;font-size:12px;overflow:hidden}
.vf .c{position:absolute;width:34px;height:34px;border:3px solid var(--accent)}
.vf .tl{left:50px;top:30px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.vf .tr{right:50px;top:30px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.vf .bl{left:50px;bottom:40px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.vf .br{right:50px;bottom:40px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.beam{position:absolute;left:60px;right:60px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:beam 2s ease-in-out infinite alternate}
@keyframes beam{from{top:48px}to{top:150px}}
@media (prefers-reduced-motion:reduce){.beam{animation:none;top:100px}.chev{transition:none}}
.dz{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--surface2)}
.dz span{color:var(--muted);font-size:12px}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0}
.scanres{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:var(--surface2);border-radius:12px}
.scanres .t{flex:1;min-width:0}
.scanres .t b,.scanres .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scanres .t span{color:var(--muted);font-size:12px}
.scanres .code{font:600 20px var(--f-mono);color:var(--accent)}
.scanres.low .code{color:var(--warn)}
.gh{display:flex;align-items:center;gap:6px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface2);padding:6px 12px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;position:sticky;top:0;z-index:1}
.gh .n{margin-left:auto;font-weight:500}
.pane .gh,.pbody>.gh{position:static;border:0;border-radius:8px;margin-top:14px}
.pbody>.gh{width:calc(100% - 28px);margin-left:14px}
.chev{display:inline-flex;transition:transform .15s}
.chev.c{transform:rotate(-90deg)}
.chev svg{width:14px;height:14px}
.gby{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.pane .gby{padding:12px 0 0;border:0}
.pbody>.gby{border:0;padding:4px 14px 0}
.mseg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px}
.mseg button{border:0;background:none;padding:3px 10px;border-radius:6px;color:var(--muted);font-size:12px}
.mseg button.on{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 6px;flex:none;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 10px;font-size:12px;line-height:20px;color:var(--muted)}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.slabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.btn.fav{color:#d99a00}
.btn.fav svg{fill:currentColor}
.mbox label.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin:0;font-size:14px;color:var(--fg)}
.frow .t{flex:1;min-width:0}
.frow .t b,.frow .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .t span{color:var(--muted);font-size:12px}
.flist{max-height:230px;overflow:auto;margin-top:8px;border-top:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pbody>.pane,.pbody>.gby,.pbody>.gh,.pbody>div:not(.rows){flex:none}
.screen{position:absolute;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.phone .screen{padding-top:34px}
.shead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.shead h2{font:600 18px var(--f-head);margin:0}
.sbody{width:min(520px,100%);margin:0 auto;padding:22px 16px}
.col{position:relative}
.fabc{position:absolute;right:18px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:6}
.fabc svg{width:26px;height:26px;transition:transform .2s}
.fabc.open svg{transform:rotate(45deg)}
.fabc.spin-open svg{animation:spinO .5s cubic-bezier(.2,.8,.2,1)}
.fabc.spin-close svg{animation:spinC .45s cubic-bezier(.2,.8,.2,1)}
@keyframes spinO{from{transform:rotate(0)}to{transform:rotate(405deg)}}
@keyframes spinC{from{transform:rotate(45deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fabc svg{animation:none!important}}
.scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.28)}
.sdmenu{position:absolute;display:flex;flex-direction:column-reverse;gap:12px;align-items:flex-end;z-index:6}
.phone .fabc{bottom:78px}
.phone .sdmenu{bottom:146px;right:24px}
.col .fabc{bottom:16px;right:16px}
.col .sdmenu{bottom:84px;right:22px}
.sd{display:flex;align-items:center;gap:10px;animation:pop .18s ease-out both;animation-delay:calc(var(--k)*35ms)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
.sdl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap}
.sdb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.22);flex:none}
@media (prefers-reduced-motion:reduce){.sd{animation:none}.fabc svg{transition:none}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));column-gap:14px;margin-top:2px}
.tr{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.tr:hover{background:var(--surface2)}
.tr .av{width:28px;height:28px;border-radius:8px;font-size:13px}
.tr .t{flex:1;min-width:0}
.tr .t b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t span{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .code{font:600 17px var(--f-mono);letter-spacing:.04em;color:var(--accent);flex:none}
.tr.low .code{color:var(--warn)}
.tr .ring{width:18px;height:18px;flex:none}
.tr .ring circle{stroke-width:3.5}
.pbody>.tgrid{padding:0 14px;grid-template-columns:1fr}
.pane .gh,.pbody>.gh{margin-top:8px}

function b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let b='';for(const c of s.toUpperCase()){const v=A.indexOf(c);if(v>=0)b+=v.toString(2).padStart(5,'0')}const o=[];for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.slice(i,i+8),2));return new Uint8Array(o)}

  return {weak,reuse,no2fa,leak,score,lab:score>=80?'Tốt':score>=50?'Cần cải thiện':'Nguy hiểm',cls:score>=80?'':score>=50?'m':'w'};

function genInfo(){
  const g=S.gen,pool=(g.up?24:0)+(g.low?25:0)+(g.num?8:0)+(g.sym?13:0)||25;
  const bits=Math.round(g.len*Math.log2(pool));
  const lab=bits<40?'Yếu':bits<60?'Khá':bits<80?'Mạnh':'Rất mạnh';
  return {bits,lab,pct:Math.min(100,Math.round(bits/110*100)),cls:bits<40?'w':bits<60?'m':''};
}

const VIRX0=/[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
const ASC=new RegExp('(^|[^A-Za-z])('+Object.keys(EN).filter(k=>!VIRX0.test(k)).join('|')+')($|[^A-Za-z])');
const VIRX={test:t=>VIRX0.test(t)||ASC.test(t)};
const keysEN=Object.keys(EN).sort((a,b)=>b.length-a.length);
function trs(str){
  if(!VIRX.test(str))return str;
  let r=str;
  RXS.forEach(([re,rep])=>{r=r.replace(re,rep)});
  for(let i=0;i<keysEN.length&&VIRX.test(r);i++){const k=keysEN[i];if(r.indexOf(k)>=0)r=r.split(k).join(EN[k])}
  return r;
}

const OPTS={childList:true,subtree:true,characterData:true};
function trEl(el){
  if(el.tagName==='OPTION'&&!el.hasAttribute('value'))el.setAttribute('value',el.textContent);
  ['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v&&VIRX.test(v))el.setAttribute(a,trs(v))});
  el.childNodes.forEach(c=>{
    if(c.nodeType===3){if(VIRX.test(c.nodeValue))c.nodeValue=trs(c.nodeValue)}
    else if(c.nodeType===1&&c.tagName!=='SCRIPT'&&c.tagName!=='STYLE')trEl(c);
  });
}
const obs=new MutationObserver(ms=>{
  if(S.lang!=='en')return;
  obs.disconnect();
  ms.forEach(m=>{
    m.addedNodes.forEach(n=>{
      if(n.nodeType===1)trEl(n);
      else if(n.nodeType===3&&VIRX.test(n.nodeValue))n.nodeValue=trs(n.nodeValue);
    });
    if(m.type==='characterData'&&VIRX.test(m.target.nodeValue))m.target.nodeValue=trs(m.target.nodeValue);
  });
  obs.observe(document.body,OPTS);
});
const STAT=[];
(function(){
  const top=document.querySelector('.top'),w=document.createTreeWalker(top,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let n;
  while((n=w.nextNode())){
    if(n.nodeType===3){if(VIRX.test(n.nodeValue))STAT.push([n,n.nodeValue,null])}
    else{const a=n.getAttribute('aria-label');if(a&&VIRX.test(a))STAT.push([n,a,'aria-label'])}
  }
})();
function setStatic(){
  STAT.forEach(([n,o,a])=>{const v=S.lang==='en'?trs(o):o;if(a)n.setAttribute(a,v);else n.nodeValue=v});
  $('#l-vi').classList.toggle('on',S.lang==='vi');
  $('#l-en').classList.toggle('on',S.lang==='en');
  document.documentElement.lang=S.lang;
}
function setLang(v){S.lang=v;try{localStorage.setItem('km-lang',v)}catch(e){}setStatic();render()}
obs.observe(document.body,OPTS);
setStatic();

render();
</script>
