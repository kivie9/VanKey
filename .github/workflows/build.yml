name: Build & Release

# - Push lên nhánh main: build Android và Windows (rẻ), tải về phần Artifacts.
# - Push tag dạng v1.2.3: build cả 3 nền tảng rồi tạo GitHub Release. Số phiên bản của app lấy từ tag,
#   push lên main thì lấy từ pubspec.yaml. Số build là số lần chạy workflow (tăng dần, Android cần để cài đè).
# - Chạy tay (Actions -> Run workflow): chọn nền tảng cần build. iOS tốn phút nhiều nhất nên chỉ chạy khi chọn.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Nền tảng cần build"
        type: choice
        options: [android, windows, ios, all]
        default: android

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'android' || inputs.platforms == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Số phiên bản
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Phiên bản phải có dạng 1.2.3 (tag v1.2.3), đang là '$v'."
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      # Khóa ký bản phát hành (tạo bằng app/scripts/create-android-signing-key.cmd). Thiếu secret thì dừng hẳn: bản ký bằng khóa debug
      # của CI đổi mỗi lần chạy, không cài đè được bản cũ (người dùng phải gỡ app và mất kho trên máy).
      - name: Khóa ký Android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Chưa đặt secret ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (xem app/scripts/create-android-signing-key.ps1)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'windows' || inputs.platforms == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Số phiên bản
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Phiên bản phải có dạng 1.2.3 (tag v1.2.3), đang là '$v'."
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - run: flutter build windows --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      # Máy chưa cài Visual C++ Redistributable cần 3 DLL này cạnh vankey.exe (windows/CMakeLists.txt tự chép vào).
      - name: Kiểm tra đã kèm VC++ runtime
        shell: pwsh
        run: |
          foreach ($f in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "build\windows\x64\runner\Release\$f")) { Write-Error "Thiếu $f trong bản build"; exit 1 }
          }

      - name: Tạo bộ cài (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.ver.outputs.name }}" installer\vankey.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Đóng gói bản portable (zip)
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\installer\vankey-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-windows
          path: app/build/installer/
          retention-days: 7

  ios:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'ios' || inputs.platforms == 'all'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Đóng gói .app (chưa ký)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr vankey-ios-unsigned.zip Payload

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-ios-unsigned
          path: app/build/ios/iphoneos/vankey-ios-unsigned.zip
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Gom file và tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p upload
          cp release-files/vankey-android/app-release.apk "upload/vankey-${TAG}-android.apk"
          cp release-files/vankey-windows/*-windows-setup.exe "upload/vankey-${TAG}-windows-setup.exe"
          cp release-files/vankey-windows/vankey-windows-portable.zip "upload/vankey-${TAG}-windows-portable.zip"
          gh release create "$TAG" upload/* \
            --title "VanKey $TAG" \
            --generate-notes
