name: Build & Release

# - Push to main: build Android and Windows (cheap); download them from the run's Artifacts.
# - Push a tag like v1.2.3: build all 3 platforms, then create a GitHub Release. The app version comes from the tag;
#   on main it comes from pubspec.yaml. The build number is the workflow run number (always increasing, which
#   Android needs to install over an older build).
# - Manual run (Actions -> Run workflow): pick the platforms to build. iOS costs the most minutes, so it only runs when picked.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only changes to the app (or this workflow) build on main; site/, server/ and docs don't.
    # GitHub ignores path filters on tag pushes, so tags still release.
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        options: [android, windows, ios, all]
        default: android

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'android' || inputs.platforms == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android lint in the current Gradle plugin calls Java 21 APIs (List.removeLast) and crashes on 17.
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Version number
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (tag v1.2.3), got '$v'."
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      # Release signing key (created with app/scripts/create-android-signing-key.cmd). Missing secrets stop the build:
      # a build signed with CI's debug key changes on every run and can't install over the previous one
      # (users would have to uninstall the app and lose the vault on the device).
      - name: Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are not set (see app/scripts/create-android-signing-key.ps1)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'windows' || inputs.platforms == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Version number
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (tag v1.2.3), got '$v'."
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"

      - run: flutter build windows --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}

      # PCs without the Visual C++ Redistributable need these 3 DLLs next to vankey.exe (windows/CMakeLists.txt copies them).
      - name: Check VC++ runtime is bundled
        shell: pwsh
        run: |
          foreach ($f in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "build\windows\x64\runner\Release\$f")) { Write-Error "$f is missing from the build"; exit 1 }
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.ver.outputs.name }}" installer\vankey.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable build (zip)
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\installer\vankey-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-windows
          path: app/build/installer/
          retention-days: 7

  ios:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'ios' || inputs.platforms == 'all'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package .app (unsigned)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr vankey-ios-unsigned.zip Payload

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-ios-unsigned
          path: app/build/ios/iphoneos/vankey-ios-unsigned.zip
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Collect files and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p upload
          cp release-files/vankey-android/app-release.apk "upload/vankey-${TAG}-android.apk"
          cp release-files/vankey-windows/*-windows-setup.exe "upload/vankey-${TAG}-windows-setup.exe"
          cp release-files/vankey-windows/vankey-windows-portable.zip "upload/vankey-${TAG}-windows-portable.zip"
          gh release create "$TAG" upload/* \
            --title "VanKey $TAG" \
            --generate-notes
