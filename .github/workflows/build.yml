name: Build & Release

# - Push lên nhánh main: build Android và Windows (rẻ), tải về phần Artifacts.
# - Push tag v* (ví dụ v0): build cả 3 nền tảng rồi tạo GitHub Release.
# - Chạy tay (Actions -> Run workflow): chọn nền tảng cần build. iOS tốn phút nhiều nhất nên chỉ chạy khi chọn.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Nền tảng cần build"
        type: choice
        options: [android, windows, ios, all]
        default: android

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'android' || inputs.platforms == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'windows' || inputs.platforms == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Đóng gói thư mục Release thành zip
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "vankey-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-windows
          path: app/vankey-windows.zip
          retention-days: 7

  ios:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'ios' || inputs.platforms == 'all'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Đóng gói .app (chưa ký)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qr vankey-ios-unsigned.zip Payload

      - uses: actions/upload-artifact@v4
        with:
          name: vankey-ios-unsigned
          path: app/build/ios/iphoneos/vankey-ios-unsigned.zip
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Gom file và tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p upload
          cp release-files/vankey-android/app-release.apk "upload/vankey-${TAG}-android.apk"
          cp release-files/vankey-windows/vankey-windows.zip "upload/vankey-${TAG}-windows.zip"
          gh release create "$TAG" upload/* \
            --title "VanKey $TAG" \
            --generate-notes
