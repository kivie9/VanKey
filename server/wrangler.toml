name = "vankey"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Số tài khoản tối đa (bảo vệ hạn mức miễn phí). Đăng ký là mở; muốn đóng hoặc mời riêng thì đặt secret REGISTER_CODE.
[vars]
MAX_USERS = "200"

# Sau khi chạy `npx wrangler d1 create vankey`, dán database_id vào đây.
[[d1_databases]]
binding = "DB"
database_name = "vankey"
database_id = "a2381b9e-3de8-43e6-8e75-56caa5909430"
migrations_dir = "migrations"

# Bí mật KHÔNG đặt ở đây. Dùng:  npx wrangler secret put TOKEN_SECRET   (chuỗi ngẫu nhiên ≥ 32 ký tự)
# Tùy chọn: npx wrangler secret put REGISTER_CODE   (mã mời ≥ 12 ký tự; đã đặt thì tạo tài khoản phải nhập mã)

# Observability: log, trace và Issues (cảnh báo lỗi thời gian thực) trên dashboard Cloudflare.
# redact_query_string = true: bỏ query string khỏi URL trong log và trace.
# Log và trace có thể chứa metadata yêu cầu (kể cả IP). Xem lại trang Quyền riêng tư trước khi mở đăng ký.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = true
persist = true

[observability.issues]
enabled = true
